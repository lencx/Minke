name: Feature request / 功能建议
description: Suggest an improvement or a new capability. / 建议改进或新增功能。
title: "[Feature] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve rather than worrying about the correct category. Maintainers will handle the final classification and labels.

        请重点描述你希望解决的问题，不必担心分类是否准确，最终分类和标签将由维护者处理。

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing issues and did not find the same request. / 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: This issue focuses on one feature or improvement. / 此 Issue 只聚焦一个功能或改进。
          required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem or motivation / 问题或动机
      description: What is difficult today, and who would benefit from improving it? / 当前有什么困难？改进后会帮助哪些用户？
      placeholder: Describe the user need or workflow first. / 请先描述用户需求或使用场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: Describe the behavior or experience you would like. / 描述你希望实现的行为或体验。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
      description: Optional workarounds or alternative designs. / 可填写目前的临时方案或其他设计。

  - type: dropdown
    id: platform
    attributes:
      label: Affected platform / 影响平台
      options:
        - All or multiple platforms / 全部或多个平台
        - Windows
        - macOS
        - Linux
        - Other or not sure / 其他或不确定
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Possibly related area / 可能相关的模块
      description: Choose the closest option; it is fine to select "not sure." / 选择最接近的一项，不确定也没关系。
      options:
        - Desktop UI, windows, tray, or shortcuts / 桌面界面、窗口、托盘或快捷键
        - Installation or packaging / 安装或打包
        - DeepSeek Harness integration / DeepSeek Harness 集成
        - CI or releases / CI 或发布流程
        - Model runtime or provider / 模型运行时或供应商
        - Documentation / 文档
        - Other or not sure / 其他或不确定
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context / 补充信息
      description: Add mockups, examples, links, or other useful context. / 可添加设计稿、示例、链接或其他相关信息。
