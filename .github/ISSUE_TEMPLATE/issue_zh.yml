name: 提交问题（中文）
description: 反馈问题、提出改进建议或咨询使用方法。
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        你不需要判断正确的 GitHub 标签。请提供已知信息，维护者会在审核后完成分类。

  - type: dropdown
    id: kind
    attributes:
      label: 最接近哪种情况？
      options:
        - Bug 或非预期行为
        - 新功能或改进建议
        - 使用问题
        - 文档
        - 其他或不确定
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 简要说明你的需求或观察到的情况。
      placeholder: 请填写清晰、简洁的概要。
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 详细信息
      description: 请提供相关背景、预期结果、实际情况或示例。
    validations:
      required: true

  - type: input
    id: minke_version
    attributes:
      label: Minke 版本
      description: 如与问题相关，可从“关于”页面或安装包文件名中查看。
      placeholder: 例如 0.1.0

  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - 不适用或不确定
        - Windows
        - macOS
        - Linux
        - 多个平台
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 可能相关的模块
      description: 请选择最接近的一项，不确定也没关系。
      options:
        - 不确定
        - 桌面界面、窗口、托盘或快捷键
        - 安装或打包
        - DeepSeek Harness 集成
        - CI 或发布流程
        - 模型运行时或供应商
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤或示例
      description: 如反馈问题，请提供操作步骤和预期结果；如提出建议或问题，可补充相关示例。

  - type: textarea
    id: supporting_information
    attributes:
      label: 辅助信息
      description: 可添加日志、截图、录屏或链接，请先移除密钥和隐私信息。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 中的相关内容。
          required: true
        - label: 我已移除密钥和隐私信息。
          required: true
