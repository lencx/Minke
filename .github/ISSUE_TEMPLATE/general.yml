name: General issue / 通用反馈（不确定分类）
description: Use this when none of the other templates fit or you are unsure. / 不确定如何分类或其他模板不适用时使用。
title: "[General] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        You do not need to know the correct category. Share what you know, and maintainers will review and label the issue.

        你不需要判断准确分类。请提供已知信息，维护者会在审核后补充标签。

  - type: dropdown
    id: kind
    attributes:
      label: What best describes this issue? / 最接近哪种情况？
      options:
        - Something is not working / 某项功能无法正常工作
        - Usage question / 使用问题
        - Improvement idea / 改进想法
        - Documentation / 文档
        - Other or not sure / 其他或不确定
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary / 概要
      description: Briefly explain what you need or observed. / 简要说明你的需求或观察到的情况。
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details / 详细信息
      description: Include context, steps, expected results, or examples when relevant. / 可提供背景、操作步骤、预期结果或示例。
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 操作系统
      options:
        - Not applicable or not sure / 不适用或不确定
        - Windows
        - macOS
        - Linux
        - Multiple platforms / 多个平台
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Possibly related area / 可能相关的模块
      options:
        - Not sure / 不确定
        - Desktop UI, windows, tray, or shortcuts / 桌面界面、窗口、托盘或快捷键
        - Installation or packaging / 安装或打包
        - DeepSeek Harness integration / DeepSeek Harness 集成
        - CI or releases / CI 或发布流程
        - Model runtime or provider / 模型运行时或供应商
        - Documentation / 文档
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: supporting_information
    attributes:
      label: Supporting information / 辅助信息
      description: Add logs, screenshots, links, or examples. Remove secrets and private information first. / 可添加日志、截图、链接或示例，请先移除密钥和隐私信息。

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing issues for related reports. / 我已搜索现有 Issue 中的相关内容。
          required: true
        - label: I removed secrets and private information. / 我已移除密钥和隐私信息。
          required: true
