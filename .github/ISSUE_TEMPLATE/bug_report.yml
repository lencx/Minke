name: Bug report / 问题反馈
description: Report a reproducible problem in Minke. / 反馈可以复现的 Minke 问题。
title: "[Bug] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Minke. Please provide the details you know; maintainers will handle the final classification and labels.

        感谢帮助改进 Minke。请填写你掌握的信息，最终分类和标签将由维护者处理。

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing issues and did not find the same problem. / 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: I removed secrets and private information from logs and screenshots. / 我已从日志和截图中移除密钥及隐私信息。
          required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description / 问题描述
      description: What happened, and how does it affect you? / 发生了什么？它带来了什么影响？
      placeholder: Describe the problem clearly and concisely. / 请清晰、简洁地描述问题。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: List the smallest set of steps that reproduces the problem. / 请列出能够复现问题的最少步骤。
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
      placeholder: What did you expect to happen? / 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      placeholder: What happened instead? / 实际发生了什么？
    validations:
      required: true

  - type: input
    id: minke_version
    attributes:
      label: Minke version / Minke 版本
      description: Find this in the About screen or release filename. / 可从“关于”页面或安装包文件名中查看。
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - Multiple platforms / 多个平台
        - Other or not sure / 其他或不确定
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System details / 系统信息
      description: Include OS version, CPU architecture, and Linux distribution when relevant. / 请填写系统版本、CPU 架构；Linux 用户请注明发行版。
      placeholder: e.g. Windows 11 24H2 x64; Ubuntu 24.04 x64
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Installation method / 安装方式
      options:
        - Official release package / 官方发布安装包
        - Built from source / 从源码构建
        - Development mode (`pnpm start`) / 开发模式
        - Other or not sure / 其他或不确定
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Possibly related area / 可能相关的模块
      description: Choose the closest option; it is fine to select "not sure." / 选择最接近的一项，不确定也没关系。
      options:
        - Desktop UI, windows, tray, or shortcuts / 桌面界面、窗口、托盘或快捷键
        - Installation or packaging / 安装或打包
        - DeepSeek Harness integration / DeepSeek Harness 集成
        - CI or releases / CI 或发布流程
        - Model runtime or provider / 模型运行时或供应商
        - Other or not sure / 其他或不确定
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: Paste relevant logs after removing secrets and private paths. / 移除密钥和隐私路径后，粘贴相关日志。
      render: shell

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context / 补充信息
      description: Add screenshots, recordings, workarounds, or anything else that may help. / 可添加截图、录屏、临时解决方法或其他有帮助的信息。
