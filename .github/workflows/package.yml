name: Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package target to run
        required: true
        default: all
        type: choice
        options:
          - all
          - win32-x64
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: >-
        ${{
          fromJSON(
            inputs.target == 'win32-x64'
            && '{"include":[{"runner":"windows-2025","platform":"win32","arch":"x64"}]}'
            || '{"include":[{"runner":"macos-15","platform":"darwin","arch":"arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64"},{"runner":"windows-2025","platform":"win32","arch":"x64"},{"runner":"ubuntu-24.04","platform":"linux","arch":"x64"}]}'
          )
        }}
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vendor/deepseek-harness/pnpm-lock.yaml

      - name: Verify runner target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: >-
          node -e "if (process.platform !== process.env.EXPECTED_PLATFORM ||
          process.arch !== process.env.EXPECTED_ARCH) { throw new Error(
          'Runner target mismatch: expected ' + process.env.EXPECTED_PLATFORM +
          '-' + process.env.EXPECTED_ARCH + ', received ' + process.platform +
          '-' + process.arch); }"

      - name: Install Linux maker prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Harness dependencies
        run: pnpm --dir vendor/deepseek-harness install --recursive --frozen-lockfile --config.node-linker=isolated

      - name: Typecheck
        run: pnpm typecheck

      - name: Test desktop
        run: pnpm test:desktop

      - name: Prepare short Windows package temp
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path 'D:\t' | Out-Null

      - name: Make distributables
        env:
          TEMP: ${{ runner.os == 'Windows' && 'D:\t' || runner.temp }}
          TMP: ${{ runner.os == 'Windows' && 'D:\t' || runner.temp }}
          SQUIRREL_TEMP: ${{ runner.os == 'Windows' && 'D:\t' || runner.temp }}
        run: pnpm make

      - name: Upload distributables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minke-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/**/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download distributables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: minke-*
          path: release-artifacts
          merge-multiple: false

      - name: Stage stable installer names
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets

          stage_asset() {
            local destination="$1"
            local artifact="$2"
            local pattern="$3"
            local matches=()
            mapfile -d '' matches < <(
              find "release-artifacts/$artifact" \
                -type f \
                -name "$pattern" \
                -print0
            )
            if (( ${#matches[@]} != 1 )); then
              echo "Expected one $artifact/$pattern asset, found ${#matches[@]}" >&2
              exit 1
            fi
            cp -- "${matches[0]}" "release-assets/$destination"
          }

          stage_asset Minke-macos-arm64.dmg \
            minke-darwin-arm64 \
            'Minke-*.dmg'
          stage_asset Minke-macos-x64.dmg \
            minke-darwin-x64 \
            'Minke-*.dmg'
          stage_asset Minke-windows-x64.exe \
            minke-win32-x64 \
            'Minke-* Setup.exe'
          stage_asset Minke-linux-x64.deb \
            minke-linux-x64 \
            'minke_*_amd64.deb'
          stage_asset Minke-linux-x64.rpm \
            minke-linux-x64 \
            'minke-*.x86_64.rpm'

          (
            cd release-assets
            sha256sum Minke-* > SHA256SUMS
          )

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-assets -type f -print0 | sort -z
          )
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Minke $GITHUB_REF_NAME"
          fi
