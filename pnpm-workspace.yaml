packages:
  - "."
  - "packages/*"

enableGlobalVirtualStore: false

# Forge's rebuild stack pins the maintained @electron/node-gyp fork from Git.
blockExoticSubdeps: false

# Electron Forge needs dependencies resolvable from a flat node_modules tree.
nodeLinker: hoisted

overrides:
  '@codemirror/view': 6.43.9
  yauzl: 3.4.0

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true

minimumReleaseAgeExclude:
  - '@codemirror/view@6.43.9'
  - '@deepseek-ai/cordis@4.0.2'
  - '@deepseek-ai/cosmokit@1.8.3'
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-invariants@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-llm@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-timeout@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-typert-protocol@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-util-crypto@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-util-values@0.1.2-alpha.4'
  - '@deepseek-ai/schemastery@3.18.2'

patchedDependencies:
  '@electron-forge/core@7.11.2': patches/@electron-forge__core@7.11.2.patch
  # Remove after a stable Forge release supports Vite 8's codeSplitting option.
  '@electron-forge/plugin-vite@7.11.2': patches/@electron-forge__plugin-vite@7.11.2.patch
